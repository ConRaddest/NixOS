config_version = 12

[audio]
enable_overdrive = true
enable_sounds = true

[bar.default]
background_opacity = 0.0
capsule_thickness = 0.63999998942017555
center = []
end = [ "tray", "network", "volume", "bluetooth", "battery", "session", "clock" ]
layer = "top"
margin_edge = 7
margin_ends = 0
padding = 20
panel_overlap = 0
position = "right"
radius = 0
scale = 1.0500000081956387
shadow = false
show_on_workspace_switch = false
start = [ "notifications", "workspaces" ]
thickness = 30
widget_spacing = 12

[control_center]
sidebar = "full"
sidebar_section = "full"

[dock]
background_opacity = 0.0
cross_axis_padding = 0
icon_size = 23
item_spacing = 0
main_axis_padding = 0
position = "right"
reserve_space = false

[hot_corners]
enabled = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.99999997764825821
border = false
history_retention_hours = 2
offset_x = 8

[osd.kinds]
media = false

[shell]
button_borders = false
card_borders = false
input_borders = false
popup_borders = false

    [shell.animation]
    enabled = false

    [shell.launcher]
    categories = false

        [shell.launcher.providers.calculator]
        prefix = ""

        [shell.launcher.providers.emoji]
        prefix = ""

    [shell.panel]
    borders = false
    control_center_placement = "floating"
    floating_layer = "top"
    floating_offset = 0
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_session = true
    session_placement = "floating"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.session]
    grid = true
    grid_columns = 2

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

    [shell.shadow]
    alpha = 0.25999999418854713

[theme]
builtin = "Tokyo-Night"

    [theme.templates]
    enable_builtin_templates = false

[wallpaper]
directory = "/home/cdt/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/cdt/Pictures/Wallpapers/sunset-lake.png"

    [wallpaper.last]
    path = "/home/cdt/Pictures/Wallpapers/sunset-lake.png"

[widget.battery]
show_label = false

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.workspaces]
focused_color = "secondary"
focused_output_only = true
font_family = "JetBrainsMono NF"
font_weight = 400
inactive_pill_size = 1.4000000000000001
scale = 0.80000000000000004
show_labels = false